<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celestials Game Hub — chơi game cùng bạn bè</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<link rel="stylesheet" href="/hub.css">
</head>
<body>
<!-- ============ MÀN HÌNH CHÍNH ============ -->
<section id="scr-home" class="screen">
  <div class="home card">
    <div class="logo">🪐</div>
    <h1 class="title">CELESTIALS</h1>
    <div class="subtitle">Game Hub · chơi cùng bạn bè qua LAN / Internet</div>
    <div id="showcase" class="showcase"></div>
    <div id="acct" class="acct hidden"></div>
    <label id="lab-name">Tên của bạn <input id="in-name" maxlength="16" placeholder="Nhập tên..." autocomplete="off"></label>
    <button id="btn-create" class="gold big">Tạo phòng mới</button>
    <div class="or">— hoặc vào phòng của bạn bè —</div>
    <div class="row"><input id="in-code" maxlength="4" placeholder="MÃ" autocomplete="off"><button id="btn-join">Vào phòng</button></div>
    <a class="small rank-link" href="/report" target="_blank">🏆 Bảng xếp hạng</a>
  </div>
</section>

<!-- ============ PHÒNG CHỜ ============ -->
<section id="scr-room" class="screen hidden">
  <div class="room card">
    <div class="room-top">
      <span>Phòng</span><span id="room-code" class="code"></span>
      <span class="grow"></span>
      <button id="btn-rank" class="ghost" title="Bảng xếp hạng (mở tab mới)">🏆</button>
      <button id="btn-copy" class="ghost">Copy link mời</button>
      <button id="btn-leave" class="ghost">Rời phòng</button>
    </div>
    <div id="room-links" class="links small muted"></div>
    <div class="section-title">Trò chơi</div>
    <div id="game-cur" class="gcur"></div>
    <div class="section-title">Chỗ ngồi</div>
    <div id="seats" class="seats"></div>
    <div id="room-opts" class="opts"></div>
    <div id="room-members" class="small muted"></div>
    <div class="room-actions">
      <span id="room-wait" class="muted grow"></span>
      <button id="btn-unsit" class="ghost">Rời ghế</button>
      <button id="btn-bots" class="ghost">Lấp ghế trống bằng bot</button>
      <button id="btn-start" class="gold big">Bắt đầu</button>
    </div>
  </div>
</section>

<!-- ============ GAME (game tự vẽ giao diện vào đây) ============ -->
<section id="scr-game" class="hidden"><div id="game-root"></div></section>
<section id="scr-loading" class="screen hidden"><div id="loading">Đang tải trò chơi...</div></section>

<!-- ============ CHAT + ĐÀM THOẠI (hiện khi đã vào phòng) ============ -->
<div id="chat" class="hidden">
  <div id="chat-peek"></div>
  <div id="chat-panel" class="card hidden">
    <div class="chat-head"><b>💬 Trò chuyện</b><span class="grow"></span><button id="chat-x" class="ghost" title="Đóng (Esc)">✕</button></div>
    <div id="voice-bar"></div>
    <div id="chat-log"></div>
    <form id="chat-form"><input id="chat-in" maxlength="200" placeholder="Nhập tin nhắn..." autocomplete="off"><button>Gửi</button></form>
  </div>
  <button id="voice-btn" class="ghost">🎙️</button>
  <button id="chat-btn" class="ghost" title="Trò chuyện (Enter)">💬<span id="chat-badge" class="hidden"></span></button>
</div>

<div id="voice-talk"></div>
<canvas id="fx"></canvas>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<div id="net" class="hidden">⚠️ Mất kết nối — đang thử lại...</div>

<script type="module" src="/hub.js"></script>
</body>
</html>
