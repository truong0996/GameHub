name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull -t gamehub:test .
      - name: Start app and run smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name gamehub-test --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /app/data:rw,uid=1000,gid=1000,mode=0700 gamehub:test
          for attempt in {1..30}; do
            if docker exec gamehub-test node -e "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            echo "Waiting for app ($attempt/30)"
            sleep 1
          done
          # Simultaneous decisions let both clients act without waiting for random bot turns.
          docker exec gamehub-test node tools/smoke.js incagold 3000 15
      - name: Container logs
        if: failure()
        run: docker logs gamehub-test
      - name: Clean up
        if: always()
        run: docker rm -f gamehub-test || true

  deploy:
    name: Deploy to games.duydang.dev
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gamehub-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.GAMEHUB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GAMEHUB_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/gamehub
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/gamehub ~/.ssh/known_hosts
      - name: Upload and deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/gamehub.tar.gz" \
            Dockerfile compose.yaml .dockerignore package.json server.js \
            hub public games tools deploy README.md
          ssh -T -i ~/.ssh/gamehub \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            ubuntu@161.118.240.112 < "$RUNNER_TEMP/gamehub.tar.gz"
      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 30 \
            https://games.duydang.dev/ --output /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://games.duydang.dev/api/report
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/gamehub ~/.ssh/known_hosts
