<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cờ Cá Ngựa — Lục Mã Hỗn Chiến</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐴</text></svg>">
<style>
:root {
  --panel: rgba(18, 22, 56, .82); --line: rgba(255,255,255,.12); --txt: #eef0ff; --muted: #9aa3d4; --gold: #ffd23f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; color: var(--txt); font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; overflow: hidden;
  background: radial-gradient(ellipse at 30% 15%, #2b2368 0%, #0d1236 50%, #050716 100%); }
#stars { position: fixed; inset: 0; pointer-events: none; opacity: .7;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 22% 72%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 37% 34%, #ffe9a8, transparent), radial-gradient(1px 1px at 48% 88%, #fff, transparent),
    radial-gradient(1px 1px at 58% 12%, #fff, transparent), radial-gradient(1.5px 1.5px at 66% 54%, #bcd4ff, transparent),
    radial-gradient(1px 1px at 76% 26%, #fff, transparent), radial-gradient(1.5px 1.5px at 86% 78%, #fff, transparent),
    radial-gradient(1px 1px at 93% 42%, #ffd6f5, transparent), radial-gradient(1px 1px at 5% 50%, #fff, transparent);
  background-size: 420px 420px; animation: twinkle 5s ease-in-out infinite alternate; }
@keyframes twinkle { to { opacity: .35; } }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 10px 16px; color: #fff; font-weight: 650;
  background: linear-gradient(180deg, #5f6fff, #3b46c9); box-shadow: 0 4px 0 #262d8a, 0 6px 16px rgba(0,0,0,.35); transition: transform .08s, filter .15s; }
button:hover:not(:disabled) { filter: brightness(1.12); }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #262d8a; }
button:disabled { filter: grayscale(.85) brightness(.65); cursor: not-allowed; }
button.gold { background: linear-gradient(180deg, #ffe066, #f0a500); color: #3a2500; box-shadow: 0 4px 0 #a86d00, 0 6px 16px rgba(0,0,0,.35); }
button.ghost { background: rgba(255,255,255,.08); box-shadow: none; }
button.big { font-size: 18px; padding: 14px 22px; }
input, select { font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--txt); }
select:disabled { opacity: .75; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,.5); }

/* ---------- Home ---------- */
.home { width: min(440px, 94vw); display: flex; flex-direction: column; gap: 14px; text-align: center; position: relative; z-index: 2; }
.logo { font-size: 64px; filter: drop-shadow(0 6px 20px rgba(255,210,63,.5)); animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
.title { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: .03em; line-height: 1;
  background: linear-gradient(90deg, #ff4d6d, #ff9f1c, #ffd23f, #2ec76b, #3a9bff, #b06cff); -webkit-background-clip: text; background-clip: text; color: transparent;
  background-size: 200% 100%; animation: rainbow 6s linear infinite; }
@keyframes rainbow { to { background-position: 200% 0; } }
.subtitle { color: var(--muted); margin-top: -6px; }
.home label { text-align: left; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .25em; text-align: center; font-weight: 700; }
.or { color: var(--muted); font-size: 13px; }
#race { position: fixed; left: 0; right: 0; bottom: 4vh; height: 60px; pointer-events: none; }
#race span { position: absolute; font-size: 44px; animation: gallop linear infinite; filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
@keyframes gallop { from { left: -8%; } to { left: 108%; } }
#race span i { display: inline-block; font-style: normal; transform: scaleX(-1); animation: hop .35s ease-in-out infinite alternate; }
@keyframes hop { to { transform: scaleX(-1) translateY(-10px) rotate(-8deg); } }

/* ---------- Room ---------- */
.room { width: min(880px, 96vw); max-height: 96vh; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
.room-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 20px; }
.room-top .grow { flex: 1; }
.code { font-size: 30px; font-weight: 900; letter-spacing: .2em; color: var(--gold); text-shadow: 0 0 18px rgba(255,210,63,.5); }
.links code { background: rgba(0,0,0,.35); padding: 2px 8px; border-radius: 6px; color: #cfe1ff; user-select: all; }
.seats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.seat { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; min-height: 92px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 28%, transparent), rgba(0,0,0,.25)); border: 2px solid color-mix(in srgb, var(--c) 55%, transparent); transition: transform .15s; }
.seat-open { cursor: pointer; border-style: dashed; }
.seat-open:hover { transform: translateY(-3px); }
.seat-closed { opacity: .45; }
.seat.mine { box-shadow: 0 0 0 3px #fff, 0 0 24px var(--c); }
.seat-horse { font-size: 46px; color: var(--c); text-shadow: 0 0 14px var(--c); font-family: 'Segoe UI Symbol', 'DejaVu Sans', serif; }
.seat-color { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.seat-who { font-weight: 700; font-size: 17px; }
.seat-sel { position: absolute; top: 8px; right: 8px; padding: 3px 6px; font-size: 12px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.opts label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.room-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.room-actions .grow { flex: 1; }

/* ---------- Game ---------- */
.game { display: grid; grid-template-columns: 260px minmax(0, 1fr) 300px; gap: 12px; width: 100%; height: 100%; padding: 12px; }
.side { background: var(--panel); border-radius: 18px; border: 1px solid var(--line); padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
#board-wrap { position: relative; align-self: center; justify-self: center; width: min(100%, calc(100vh - 24px)); aspect-ratio: 1; container-type: inline-size; }
#board { width: 100%; height: 100%; display: block; user-select: none; }
#board-wrap.shake { animation: shake .55s; }
@keyframes shake { 10%,90% { transform: translate(-2px, 1px); } 20%,80% { transform: translate(4px, -2px); } 30%,50%,70% { transform: translate(-7px, 3px) rotate(-.4deg); } 40%,60% { transform: translate(7px, -3px) rotate(.4deg); } }
#weather { position: absolute; inset: 4%; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .4s; }
#weather.on { opacity: 1; }
#weather.w-tsunami { background: linear-gradient(100deg, transparent 20%, rgba(40,140,255,.55) 45%, rgba(160,220,255,.6) 50%, transparent 70%); background-size: 300% 100%; animation: sweep 2.4s linear; }
#weather.w-tailwind { background: repeating-linear-gradient(80deg, transparent 0 40px, rgba(120,255,170,.22) 40px 46px); background-size: 300% 100%; animation: sweep 2.4s linear reverse; }
#weather.w-tornado { background: conic-gradient(from 0deg, transparent, rgba(200,200,255,.35), transparent 30%, rgba(200,200,255,.35) 60%, transparent); animation: spinBg 1s linear infinite; }
#weather.w-meteor { background: radial-gradient(circle, rgba(255,80,20,.0) 30%, rgba(255,60,0,.35)); animation: pulseBg .5s ease-in-out infinite alternate; }
#weather.w-quake { background: radial-gradient(circle, rgba(255,140,0,.2), transparent 70%); }
#weather.w-festival { background: conic-gradient(#ff4d6d55, #ff9f1c55, #ffd23f55, #2ec76b55, #3a9bff55, #b06cff55, #ff4d6d55); animation: spinBg 3s linear infinite; }
@keyframes sweep { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes spinBg { to { transform: rotate(360deg); } }
@keyframes pulseBg { to { opacity: .55; } }

/* Board SVG */
.cell { fill: rgba(255,255,255,.10); stroke: rgba(255,255,255,.32); stroke-width: 1.5; }
.emo { text-anchor: middle; dominant-baseline: central; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; pointer-events: none; }
.lbl { text-anchor: middle; dominant-baseline: central; font-weight: 800; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 5px; pointer-events: none; }
.horse { transition: none; }
.horse .knight { font-size: 21px; fill: #fff; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: rgba(0,0,0,.45); stroke-width: 2px; font-family: 'Segoe UI Symbol', 'DejaVu Sans', 'Noto Sans Symbols2', serif; pointer-events: none; }
.horse .halo { fill: none; stroke: #fff; stroke-width: 3.5; opacity: 0; transform-box: fill-box; transform-origin: center; }
.horse.sel { cursor: pointer; }
.horse.sel .halo { opacity: 1; animation: halo .9s ease-in-out infinite; }
.horse.sel-opp .halo { stroke: #ff5a5a; }
@keyframes halo { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.4); opacity: .2; } }
.horse .shieldc { fill: rgba(126,232,255,.16); stroke: #7ee8ff; stroke-width: 2.5; stroke-dasharray: 6 3; opacity: 0; transform-box: fill-box; transform-origin: center; }
.horse.shielded .shieldc { opacity: 1; animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite; }
.sp-mystery circle { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.15); } }
.m-ring { fill: rgba(255,80,20,.2); stroke: #ff5a2a; stroke-width: 3; stroke-dasharray: 6 4; transform-box: fill-box; transform-origin: center; animation: mpulse .7s ease-in-out infinite alternate; }
@keyframes mpulse { to { transform: scale(1.18); fill: rgba(255,80,20,.38); } }
.hint { fill: rgba(255,255,255,.12); stroke: #fff; stroke-width: 2.5; stroke-dasharray: 5 4; transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; pointer-events: none; }

/* Dice */
#dice { position: absolute; left: 50%; top: 50%; width: 7.5cqw; height: 7.5cqw; margin: -3.75cqw 0 0 -3.75cqw; perspective: 40cqw; z-index: 3; pointer-events: none; }
#dice.can { pointer-events: auto; cursor: pointer; }
#dice.can::after { content: ''; position: absolute; inset: -1.6cqw; border-radius: 30%; border: .35cqw solid var(--gold); animation: halo 1s ease-in-out infinite; }
#dice::before { content: ''; position: absolute; inset: -2cqw; border-radius: 50%; background: radial-gradient(circle, var(--glow, #fff) 0%, transparent 65%); opacity: .45; z-index: -1; }
#dice.bounce { animation: dbounce 1s ease-out; }
@keyframes dbounce { 0% { transform: translateY(0) scale(1); } 20% { transform: translateY(-3.5cqw) scale(1.3); } 50% { transform: translateY(0) scale(1.08); } 70% { transform: translateY(-1cqw) scale(1.04); } 100% { transform: translateY(0) scale(1); } }
.cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.15,.85,.3,1.08); }
.face { position: absolute; inset: 0; border-radius: 18%; background: linear-gradient(145deg, #ffffff, #d9dcf0); box-shadow: inset 0 0 .7cqw rgba(0,0,0,.28);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 13%; backface-visibility: hidden; }
.face i { width: 74%; height: 74%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #555, #000); place-self: center; }
.face i.off { visibility: hidden; }
.face.red i { background: radial-gradient(circle at 35% 35%, #ff7b7b, #b00000); }
.f1 { transform: translateZ(3.75cqw); }
.f6 { transform: rotateY(180deg) translateZ(3.75cqw); }
.f2 { transform: rotateY(90deg) translateZ(3.75cqw); }
.f5 { transform: rotateY(-90deg) translateZ(3.75cqw); }
.f3 { transform: rotateX(90deg) translateZ(3.75cqw); }
.f4 { transform: rotateX(-90deg) translateZ(3.75cqw); }
#dice.golden .face { background: linear-gradient(145deg, #fff6c2, #f0b400); }
#dice-mods { position: absolute; left: 50%; top: calc(50% + 5.6cqw); transform: translateX(-50%); font-size: 2cqw; font-weight: 800; white-space: nowrap; text-shadow: 0 2px 6px #000; pointer-events: none; }

/* Banner */
#banner { position: absolute; left: 50%; top: 29%; width: 92%; transform: translate(-50%, -50%) scale(.4); opacity: 0; pointer-events: none; text-align: center; z-index: 6;
  transition: opacity .2s, transform .4s cubic-bezier(.2,1.6,.4,1); }
#banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#banner .b-big { font-size: 6cqw; font-weight: 900; letter-spacing: .02em; -webkit-text-stroke: .22cqw rgba(0,0,0,.6); paint-order: stroke fill; text-shadow: 0 .5cqw 2cqw rgba(0,0,0,.7); line-height: 1.1; }
#banner .b-small { font-size: 2.2cqw; margin-top: .8cqw; background: rgba(0,0,0,.6); display: inline-block; padding: .5cqw 1.8cqw; border-radius: 99px; }

/* Panels */
.side-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.side-head b { color: var(--gold); letter-spacing: .15em; }
.pcard { position: relative; border-radius: 14px; padding: 9px 11px 11px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-left: 5px solid var(--c); transition: transform .2s, box-shadow .2s; }
.pcard.active { background: color-mix(in srgb, var(--c) 18%, rgba(0,0,0,.2)); box-shadow: 0 0 0 2px var(--c), 0 0 22px color-mix(in srgb, var(--c) 60%, transparent); transform: translateX(4px); }
.pcard.done { opacity: .6; }
.p-top { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.p-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tag { font-size: 10px; background: #fff; color: #222; padding: 1px 6px; border-radius: 99px; }
.p-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.p-cards { margin-top: 4px; font-size: 18px; min-height: 22px; letter-spacing: 2px; }
.p-cards .muted { letter-spacing: normal; }
.p-bar { height: 5px; border-radius: 9px; background: rgba(255,255,255,.08); margin-top: 6px; overflow: hidden; }
.p-bar i { display: block; height: 100%; background: var(--c); border-radius: 9px; transition: width .5s; }
.timer { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; overflow: hidden; border-radius: 0 0 14px 14px; }
.timer i { display: block; height: 100%; width: 0; background: #fff; transition: width .25s linear; }
.timer i.low { background: #ff4d4d; }
.infobox { font-size: 13px; padding: 8px 10px; border-radius: 12px; background: rgba(0,0,0,.25); line-height: 1.5; }
#status { font-size: 15px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.3); min-height: 46px; line-height: 1.35; }
#status.mine { background: linear-gradient(90deg, rgba(255,210,63,.25), rgba(0,0,0,.3)); box-shadow: inset 0 0 0 1px rgba(255,210,63,.5); }
#btn-roll { width: 100%; }
.hand-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#hand { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hcard { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; font-size: 11px; line-height: 1.15;
  background: linear-gradient(160deg, #3d2a7a, #1d1846); box-shadow: 0 3px 0 #120e2e, 0 0 0 1px rgba(255,255,255,.15) inset; }
.hcard b { font-size: 26px; line-height: 1.2; }
.hcard.active { box-shadow: 0 0 0 3px var(--gold), 0 0 18px var(--gold); }
.hcard.empty { opacity: .25; cursor: default; }
#card-hint { font-size: 13px; color: var(--gold); min-height: 0; }
.emotes { display: flex; flex-wrap: wrap; gap: 4px; }
.emotes button { padding: 4px 6px; font-size: 20px; background: rgba(255,255,255,.06); box-shadow: none; border-radius: 10px; }
#log { flex: 1; min-height: 120px; overflow: auto; font-size: 13px; display: flex; flex-direction: column; gap: 4px; padding-right: 4px; }
.log-item { padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.04); animation: logIn .3s ease-out; }
@keyframes logIn { from { opacity: 0; transform: translateX(10px); } }
.tools { display: flex; gap: 6px; }
.tools button { flex: 1; padding: 8px; }

/* Overlays */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.floater { position: fixed; transform: translate(-50%, -50%); pointer-events: none; z-index: 60; font-weight: 900; font-size: 22px; text-shadow: 0 2px 6px #000, 0 0 2px #000; animation: floatUp 1.6s ease-out forwards; white-space: nowrap; }
.floater.big { font-size: 40px; }
.floater.emote { font-size: 50px; animation-duration: 2.2s; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 15% { opacity: 1; transform: translate(-50%, -70%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -230%) scale(1); } }
#toast { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -200%); opacity: 0; z-index: 80; padding: 10px 18px; border-radius: 99px; background: rgba(10,12,40,.95); border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,.5); transition: transform .3s cubic-bezier(.2,1.4,.4,1); font-weight: 650; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }
#modal { position: fixed; inset: 0; z-index: 70; background: rgba(3,5,20,.7); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
#modal .card { width: min(560px, 94vw); max-height: 90vh; overflow: auto; animation: pop .35s cubic-bezier(.2,1.5,.4,1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
#modal h2 { margin-top: 0; }
.pick { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0; }
.pick button { min-width: 64px; font-size: 30px; }
.pick button.pl { font-size: 16px; background: var(--c); box-shadow: 0 4px 0 rgba(0,0,0,.4); color: #111; }
.help h3 { margin: 16px 0 6px; color: var(--gold); }
.help ul { margin: 0; padding-left: 20px; line-height: 1.55; }
.rank { list-style: none; padding: 0; margin: 12px 0; }
.rank li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; margin-bottom: 6px; background: rgba(255,255,255,.05); border-left: 5px solid var(--c); }
.rank li:first-child { background: linear-gradient(90deg, rgba(255,210,63,.3), transparent); font-size: 20px; font-weight: 800; }
.rank .grow { flex: 1; }
.center { text-align: center; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

@media (max-width: 1000px) {
  html, body { overflow: auto; }
  .screen { position: static; min-height: 100vh; padding: 10px 0; }
  .game { grid-template-columns: 1fr; height: auto; }
  #board-wrap { width: min(100%, 96vw); order: -1; }
  .side-right { order: 0; }
  .side-left { order: 1; }
  #log { max-height: 220px; }
  .side { overflow: visible; }
  .seats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div id="stars"></div>

<!-- ============ HOME ============ -->
<section id="scr-home" class="screen">
  <div class="home card">
    <div class="logo">🐴</div>
    <h1 class="title">CỜ CÁ NGỰA</h1>
    <div class="subtitle">Lục Mã Hỗn Chiến · 6 người · online</div>
    <label>Tên của bạn <input id="in-name" maxlength="16" placeholder="Nhập tên..." autocomplete="off"></label>
    <button id="btn-create" class="gold big">✨ Tạo phòng mới</button>
    <div class="or">— hoặc vào phòng của bạn bè —</div>
    <div class="row"><input id="in-code" maxlength="4" placeholder="MÃ" autocomplete="off"><button id="btn-join">Vào phòng</button></div>
    <button class="ghost" data-help>📖 Luật chơi & bí kíp</button>
  </div>
  <div id="race"></div>
</section>

<!-- ============ ROOM ============ -->
<section id="scr-room" class="screen hidden">
  <div class="room card">
    <div class="room-top">
      <span>Phòng</span><span id="room-code" class="code"></span>
      <span class="grow"></span>
      <button id="btn-copy" class="ghost">📋 Copy link mời</button>
      <button class="ghost" data-help>📖</button>
    </div>
    <div id="room-links" class="links small muted"></div>
    <div id="seats" class="seats"></div>
    <div id="room-opts" class="opts"></div>
    <div id="room-members" class="small muted"></div>
    <div class="room-actions">
      <button id="btn-leave" class="ghost">🚪 Rời phòng</button>
      <span class="grow"></span>
      <span id="room-wait" class="muted"></span>
      <button id="btn-unsit" class="ghost">Rời ghế</button>
      <button id="btn-bots" class="ghost">🤖 Lấp ghế trống bằng Bot</button>
      <button id="btn-start" class="gold big">🚀 Bắt đầu</button>
    </div>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="scr-game" class="screen hidden">
  <div class="game">
    <aside class="side side-left">
      <div class="side-head"><span>Phòng <b id="g-code"></b></span><span id="g-turns"></span></div>
      <div id="players"></div>

<script src="/game.js"></script>
<script>
'use strict';
const C = window.CCN;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const SVGNS = 'http://www.w3.org/2000/svg';
function S(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), ch = s => Math.round(Math.min(255, Math.max(0, ((n >> s) & 255) * (1 + f))));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
const KNIGHT = '♞︎';
const EMOTES = ['😂', '😎', '😡', '😭', '🔥', '👏', '🐴', '💀', '🙏', '🤡'];

// ================= STATE =================
const ME = { pid: null, uid: null, code: null, lan: [] };
let ROOM = null, GAME = null, GAME_ID = null, NAMES = [];
let DEADLINE = 0, pending = false, cardMode = null, es = null, SPEED = 1, playing = false, overShown = false;
const Q = [];
const mySeat = () => ROOM ? ROOM.seats.findIndex(s => s.kind === 'human' && s.uid === ME.uid) : -1;
const canAct = () => !!GAME && !playing && !pending && GAME.phase !== 'over' && mySeat() >= 0 && GAME.turn === mySeat();
const nm = p => p == null ? '???' : `<b style="color:${C.SEATS[p].color}">${esc(NAMES[p] || C.SEATS[p].name)}</b>`;

// ================= SOUND =================
const SND = { ctx: null, master: null, on: localStorage.getItem('ccn_snd') !== '0', music: localStorage.getItem('ccn_music') === '1' };
function ac() {
  if (!SND.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    SND.ctx = new AC(); SND.master = SND.ctx.createGain(); SND.master.gain.value = .7; SND.master.connect(SND.ctx.destination);
  }
  if (SND.ctx.state === 'suspended') SND.ctx.resume();
  return SND.ctx;
}
function tone(f, d, o = {}) {
  if (!(o.music ? SND.music : SND.on)) return;
  const c = ac(); if (!c) return;
  const t = c.currentTime + (o.delay || 0), osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(o.v ?? .2, t + (o.a || .008)); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  osc.connect(g); g.connect(SND.master); osc.start(t); osc.stop(t + d + .05);
}
let NOISE = null;
function noise(d, o = {}) {
  if (!SND.on) return;
  const c = ac(); if (!c) return;
  if (!NOISE) { NOISE = c.createBuffer(1, c.sampleRate, c.sampleRate); const a = NOISE.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = c.currentTime + (o.delay || 0), src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = NOISE; f.type = o.ft || 'bandpass'; f.frequency.value = o.f || 1000; f.Q.value = o.q || 1;
  if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + d);
  g.gain.setValueAtTime(o.v ?? .2, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.connect(f); f.connect(g); g.connect(SND.master); src.start(t, Math.random() * .4); src.stop(t + d + .05);
}
const sfx = {
  dice() { for (let i = 0; i < 8; i++) noise(.05, { v: .3, f: 1800 + Math.random() * 2500, q: 3, delay: i * .1 + Math.random() * .03 }); },
  hop(i) { tone(480 + i * 28, .07, { type: 'square', v: .045, to: 680 + i * 28 }); },
  land() { noise(.08, { v: .25, f: 600 }); tone(260, .12, { type: 'triangle', v: .15, to: 180 }); },
  kick() { noise(.3, { v: .6, f: 300, ft: 'lowpass' }); tone(240, .45, { type: 'sawtooth', v: .18, to: 45 }); tone(900, .15, { type: 'square', v: .06, to: 300, delay: .02 }); },
  card() { [880, 1175, 1568, 2093].forEach((f, i) => tone(f, .2, { type: 'triangle', v: .1, delay: i * .06 })); },
  gong() { tone(98, 2.2, { v: .35, a: .01 }); tone(196.5, 1.8, { v: .14 }); tone(294, 1.3, { v: .07 }); noise(.7, { v: .12, f: 300 }); },
  tele() { tone(250, .55, { v: .14, to: 2600 }); tone(500, .5, { type: 'triangle', v: .06, to: 3200, delay: .05 }); },
  whoosh() { noise(.6, { v: .3, f: 400, fto: 3000, q: .7 }); },
  freeze() { [2093, 2637, 3136, 2637, 3520].forEach((f, i) => tone(f, .3, { v: .06, delay: i * .06 })); noise(.5, { v: .08, f: 6000, ft: 'highpass' }); },
  shield() { tone(520, .45, { v: .12, to: 1250 }); tone(780, .45, { v: .07, to: 1870, delay: .05 }); },
  mystery() { [523, 659, 784, 1047, 784, 1319].forEach((f, i) => tone(f, .22, { type: 'sine', v: .09, delay: i * .07 })); },
  boom() { noise(1, { v: .7, f: 140, ft: 'lowpass' }); tone(90, .9, { v: .4, to: 28 }); },
  meteor() { tone(2400, .6, { type: 'sawtooth', v: .04, to: 200 }); noise(.6, { v: .15, f: 3000, fto: 300 }); },
  myTurn() { tone(784, .16, { type: 'triangle', v: .16 }); tone(1175, .3, { type: 'triangle', v: .16, delay: .13 }); },
  pop() { tone(300 + Math.random() * 500, .15, { type: 'triangle', v: .1, to: 1500 }); noise(.2, { v: .12, f: 2500, delay: .05 }); },
  error() { tone(190, .16, { type: 'square', v: .07 }); },
  nomove() { tone(330, .22, { type: 'triangle', v: .12, to: 196 }); },
  tick() { tone(1400, .04, { type: 'square', v: .03 }); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => { tone(f, .35, { type: 'triangle', v: .14, delay: i * .14 }); tone(f / 2, .35, { type: 'sine', v: .08, delay: i * .14 }); }); },
};
// Nhạc nền ngũ cung (pentatonic) kiểu dân gian, rất nhẹ.
const PENTA = [293.66, 329.63, 392, 440, 493.88, 587.33, 659.25, 783.99];
let beat = 0;
setInterval(() => {
  if (!SND.music || !SND.ctx) return;
  beat++;
  if (Math.random() < .5) tone(pick(PENTA), 1.3, { type: 'triangle', v: .03, a: .02, music: true });
  if (beat % 8 === 0) tone(pick([146.83, 196, 220]), 2.8, { v: .045, a: .06, music: true });
}, 380);

// ================= FX (particles) =================
const FX = { cv: null, ctx: null, parts: [], raf: 0, dpr: 1 };
function fxResize() { FX.dpr = Math.min(2, devicePixelRatio || 1); FX.cv.width = innerWidth * FX.dpr; FX.cv.height = innerHeight * FX.dpr; }
function spawn(p) { FX.parts.push(p); if (!FX.raf) FX.raf = requestAnimationFrame(fxLoop); }
function fxLoop() {
  const { ctx, dpr } = FX;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  FX.parts = FX.parts.filter(p => p.life > 0);
  for (const p of FX.parts) {
    const dr = p.drag ?? .985;
    p.vx *= dr; p.vy = p.vy * dr + (p.g ?? .15); p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.rot += p.vr || 0;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.color;
    if (p.shape === 'r') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  FX.raf = FX.parts.length ? requestAnimationFrame(fxLoop) : 0;
}
function burst(x, y, colors, n = 30, spd = 7) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = spd * (.3 + Math.random());
    spawn({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, g: .12, life: 1, decay: .012 + Math.random() * .02, size: 2 + Math.random() * 3.5,
      color: colors[i % colors.length], shape: Math.random() < .4 ? 'r' : 'c', rot: Math.random() * 6, vr: (Math.random() - .5) * .3 });
  }
}
function confetti(n = 240) {
  const cols = C.SEATS.map(s => s.color).concat('#ffffff');
  for (let i = 0; i < n; i++) spawn({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3,
    g: .03, drag: .995, life: 1.8, decay: .0035, size: 4 + Math.random() * 4, color: pick(cols), shape: 'r', rot: Math.random() * 6, vr: (Math.random() - .5) * .25 });
}
function fireworks(n = 5) {
  for (let i = 0; i < n; i++) setTimeout(() => {
    burst(innerWidth * (.15 + Math.random() * .7), innerHeight * (.12 + Math.random() * .4), [pick(C.SEATS).color, '#fff', '#ffd23f'], 70, 8);
    sfx.pop();
  }, i * 280);
}

// ================= GEOMETRY =================
const R = 400;
const ang = k => (-90 + 60 * k) * Math.PI / 180;
const polar = (r, k) => ({ x: r * Math.cos(ang(k)), y: r * Math.sin(ang(k)) });
function trackPos(c) {
  const s = Math.floor(c / C.SIDE), t = (c % C.SIDE) / C.SIDE, a = polar(R, s), b = polar(R, (s + 1) % 6);
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}
const homePos = (p, s) => polar(R * (1 - s * .12), p);
const stableCenter = p => polar(R + 108, p);
const SLOT = [[-21, -21], [21, -21], [-21, 21], [21, 21]];
const stablePos = (p, h) => { const c = stableCenter(p); return { x: c.x + SLOT[h][0], y: c.y + SLOT[h][1] }; };
function locPos(loc) {
  const k = loc[0], r = loc.slice(1);
  if (k === 'T') return trackPos(+r);
  const [a, b] = r.split(':').map(Number);
  return k === 'H' ? homePos(a, b) : stablePos(a, b);
}
function toScreen(q) {
  const r = $('#board').getBoundingClientRect();
  return { x: r.left + (q.x + 640) / 1280 * r.width, y: r.top + (q.y + 640) / 1280 * r.height };
}

// ================= BOARD =================
let L_SPEC, L_MET, L_HINT, L_HORSE, HE = [];
function emoji(g, ch, size, y = 0, x = 0) { const t = S('text', { x, y, 'font-size': size, class: 'emo' }, g); t.textContent = ch; return t; }

function buildBoard(st) {
  const svg = $('#board');
  svg.innerHTML = '';
  const defs = S('defs', {}, svg);
  defs.innerHTML = `
    <radialGradient id="gBoard" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#2d3388"/><stop offset="1" stop-color="#0f1238"/></radialGradient>
    <radialGradient id="gCenter"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".45"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    ${C.SEATS.map((s, p) => `<radialGradient id="hg${p}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".38" stop-color="${s.color}"/><stop offset="1" stop-color="${shade(s.color, -.5)}"/></radialGradient>`).join('')}`;
  const bg = S('g', {}, svg);
  const hex = r => [0, 1, 2, 3, 4, 5].map(k => { const q = polar(r, k); return q.x + ',' + q.y; }).join(' ');
  S('polygon', { points: hex(R + 50), fill: 'url(#gBoard)', stroke: 'rgba(255,255,255,.2)', 'stroke-width': 5, 'stroke-linejoin': 'round' }, bg);
  for (let p = 0; p < 6; p++) {
    const a = polar(R - 22, p), b = polar(R - 22, (p + 1) % 6), on = st.players[p].active;
    S('polygon', { points: `0,0 ${a.x},${a.y} ${b.x},${b.y}`, fill: on ? C.SEATS[p].color : '#888', opacity: on ? .1 : .03 }, bg);
  }
  for (const r of [140, 220, 300]) S('circle', { r, fill: 'none', stroke: 'rgba(255,255,255,.06)', 'stroke-width': 2, 'stroke-dasharray': '3 12' }, bg);
  S('polygon', { points: hex(R), fill: 'none', stroke: 'rgba(255,255,255,.07)', 'stroke-width': 36, 'stroke-linejoin': 'round' }, bg);
  // đường đua
  for (let c = 0; c < C.L; c++) {
    const q = trackPos(c), p = Math.floor(c / C.SIDE), on = st.players[p].active, col = on ? C.SEATS[p].color : '#8a90b0';
    if (c % C.SIDE === 0) {
      S('circle', { cx: q.x, cy: q.y, r: 17, fill: col, 'fill-opacity': .25, stroke: col, 'stroke-width': 4 }, bg);
      const t = S('title', {}, bg.lastChild); t.textContent = `Cửa chuồng ${C.SEATS[p].name}`;
    } else if (c % C.SIDE === 1) {
      S('circle', { cx: q.x, cy: q.y, r: 15, fill: col, 'fill-opacity': on ? .9 : .3, stroke: '#fff', 'stroke-width': 2 }, bg);
      const t = S('text', { x: q.x, y: q.y + 1, 'font-size': 15, fill: '#fff', class: 'lbl', style: 'stroke-width:3px' }, bg); t.textContent = '★';
    } else S('circle', { cx: q.x, cy: q.y, r: 12.5, class: 'cell' }, bg);
  }
  // chuồng đích (6 bậc)
  for (let p = 0; p < 6; p++) {
    if (!st.players[p].active) continue;
    const col = C.SEATS[p].color, need = C.HOME - st.opts.horses;
    for (let s = 1; s <= C.HOME; s++) {
      const q = homePos(p, s);
      S('circle', { cx: q.x, cy: q.y, r: 18, fill: col, 'fill-opacity': s > need ? .3 : .12, stroke: col, 'stroke-width': s > need ? 2.5 : 1.5, 'stroke-opacity': .85 }, bg);
      const t = S('text', { x: q.x, y: q.y + 1, 'font-size': 15, fill: col, class: 'lbl', style: 'stroke-width:3px' }, bg); t.textContent = s;
    }
  }
  // tâm bàn
  S('circle', { r: 92, fill: 'url(#gCenter)' }, bg);
  S('circle', { r: 72, fill: 'rgba(8,10,36,.7)', stroke: 'rgba(255,210,63,.4)', 'stroke-width': 2.5 }, bg);
  // chuồng xuất phát
  for (let p = 0; p < 6; p++) {
    const pl = st.players[p], on = pl.active, col = on ? C.SEATS[p].color : '#5a6080', c = stableCenter(p);
    S('circle', { cx: c.x, cy: c.y, r: 60, fill: col, 'fill-opacity': on ? .16 : .05, stroke: col, 'stroke-width': 3, 'stroke-dasharray': on ? 'none' : '8 6' }, bg);
    if (on) pl.horses.forEach((_, h) => { const q = stablePos(p, h); S('circle', { cx: q.x, cy: q.y, r: 16, fill: 'rgba(0,0,0,.35)', stroke: col, 'stroke-opacity': .5 }, bg); });
    const t = S('text', { x: c.x, y: c.y + Math.sign(c.y) * 82, 'font-size': 24, fill: col, class: 'lbl' }, bg);
    t.textContent = on ? pl.name : '';
  }
  L_SPEC = S('g', {}, svg); L_MET = S('g', {}, svg); L_HINT = S('g', {}, svg); L_HORSE = S('g', {}, svg);
  HE = st.players.map((pl, p) => pl.horses.map((_, h) => makeHorse(p, h)));
  syncHorses(st);
}

function makeHorse(p, h) {
  const g = S('g', { class: 'horse', 'data-p': p, 'data-h': h }, L_HORSE);
  S('circle', { r: 30, fill: 'transparent' }, g); // vùng chạm rộng cho điện thoại
  S('ellipse', { cx: 0, cy: 14, rx: 13, ry: 4, fill: 'rgba(0,0,0,.45)' }, g);
  S('circle', { class: 'halo', r: 21 }, g);
  S('circle', { class: 'shieldc', r: 23 }, g);
  S('circle', { r: 16, fill: `url(#hg${p})`, stroke: '#fff', 'stroke-width': 2.5 }, g);
  const t = S('text', { y: 1, class: 'knight' }, g); t.textContent = KNIGHT;
  return g;
}
function placeHorse(g, x, y, extra) { g._x = x; g._y = y; g.setAttribute('transform', `translate(${x} ${y})${extra ? ' ' + extra : ''}`); }
const raise = g => g.parentNode.appendChild(g);
function syncHorses(st) {
  st.players.forEach((pl, p) => pl.horses.forEach((hs, h) => {
    const g = HE[p] && HE[p][h]; if (!g) return;
    const q = locPos(C.locKey(st, p, h));
    if (g._x !== q.x || g._y !== q.y) placeHorse(g, q.x, q.y);
    g.classList.toggle('shielded', !!hs.shield);
  }));
}
function renderSpecials(list) {
  if (!L_SPEC) return;
  L_SPEC.innerHTML = '';
  for (const s of list || []) {
    const q = trackPos(s.cell), g = S('g', { transform: `translate(${q.x} ${q.y})`, class: 'sp sp-' + s.type }, L_SPEC);
    let tip;
    if (s.type === 'portal') {
      const col = s.pair ? '#ff4fd8' : '#00e5ff';
      S('circle', { r: 16, fill: 'rgba(0,0,0,.55)', stroke: col, 'stroke-width': 3.5, 'stroke-dasharray': '7 4', class: 'spin' }, g);
      emoji(g, '🌀', 17); tip = 'Cổng dịch chuyển: dừng ở đây sẽ bay tới cổng cùng màu!';
    } else if (s.type === 'card') {
      S('circle', { r: 15, fill: '#ffcf3f', stroke: '#fff', 'stroke-width': 2 }, g);
      emoji(g, '🎁', 16); tip = 'Ô quà: dừng ở đây nhận 1 thẻ kỹ năng';
    } else {
      S('circle', { r: 15, fill: '#7b3cff', stroke: '#e0ccff', 'stroke-width': 2 }, g);
      emoji(g, '❓', 16); tip = 'Ô bí ẩn: may hay rủi? Ô này sẽ biến mất và xuất hiện chỗ khác!';
    }
    S('title', {}, g).textContent = tip;
  }
}
function renderMeteors(m) {
  if (!L_MET) return;
  L_MET.innerHTML = '';
  if (!m) return;
  for (const c of m.cells) {
    const q = trackPos(c), g = S('g', { transform: `translate(${q.x} ${q.y})` }, L_MET);
    S('circle', { r: 22, class: 'm-ring' }, g);
    emoji(g, '☄️', 16, -30);
  }
}
function clearHint() { if (L_HINT) L_HINT.innerHTML = ''; }
function showHint(m) {
  clearHint();
  const q = locPos(m.to);
  S('circle', { cx: q.x, cy: q.y, r: 21, class: 'hint' }, L_HINT);
  if (m.kick) emoji(L_HINT, '💥', 22, q.y - 30, q.x);
}

// ================= ANIMATION HELPERS =================
const wait = ms => new Promise(r => setTimeout(r, ms / SPEED));
const easeInOut = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function tween(ms, fn, ease = t => t) {
  ms /= SPEED;
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / ms); fn(ease(t)); if (t < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
}
async function hopTo(g, b, i) {
  const a = { x: g._x, y: g._y };
  sfx.hop(i);
  await tween(C.DUR.hop, t => placeHorse(g, a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t - Math.sin(Math.PI * t) * 16, `scale(${1 + Math.sin(Math.PI * t) * .2})`));
  placeHorse(g, b.x, b.y);
}
async function flyTo(g, b, { ms = C.DUR.fly, arc = 70, spin = 0, scale = .35 } = {}) {
  raise(g);
  const a = { x: g._x, y: g._y };
  await tween(ms, t => placeHorse(g, a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t - Math.sin(Math.PI * t) * arc,

// ================= QUEUE =================
function enqueue(msg) { Q.push(msg); if (!playing) pump(); }
async function pump() {
  playing = true;
  renderControls();
  while (Q.length) {
    const msg = Q.shift();
    SPEED = Q.length >= 2 ? 3.5 : Q.length === 1 ? 1.7 : 1;
    ROOM = msg.room;
    try {
      if (msg.game && msg.events.length && !document.hidden) {
        if (msg.room.gameId !== GAME_ID) prepareGame(msg);
        NAMES = msg.game.players.map(p => p.name);
        for (const e of msg.events) await playEvent(e);
      }
    } catch (err) { console.error(err); }
    applyState(msg);
  }
  SPEED = 1;
  playing = false;
  renderControls();
}
function prepareGame(msg) {
  GAME_ID = msg.room.gameId; GAME = msg.game; NAMES = GAME.players.map(p => p.name);
  overShown = false; cardMode = null;
  $('#log').innerHTML = '';
  show('game');
  buildBoard(GAME);
}
function applyState(msg) {
  ROOM = msg.room; pending = false;
  DEADLINE = msg.deadlineIn ? msg.recvAt + msg.deadlineIn : 0;
  if (msg.game) {
    if (ROOM.gameId !== GAME_ID) prepareGame(msg);
    GAME = msg.game; NAMES = GAME.players.map(p => p.name);
    renderGame();
  } else {
    GAME = null; GAME_ID = null; cardMode = null;
    if (overShown) closeModal();
    show('room'); renderRoom();
  }
}

      if (hs.loc !== 'track') return;
      if (cardMode.step === 'own' && p === me && !(cardMode.card === 'shield' && hs.shield)) HE[p][h].classList.add('sel');
      if (cardMode.step === 'opp' && p !== me && !hs.shield) HE[p][h].classList.add('sel', 'sel-opp');
    }));
    return;
  }
  if (GAME.phase === 'move') for (const m of GAME.legal) HE[me][m.h].classList.add('sel');
}
setInterval(() => {
  const bar = document.querySelector('.pcard.active .timer i');
  if (!bar) return;
  if (!DEADLINE || !GAME || GAME.phase === 'over' || playing) { bar.style.width = '0'; return; }
  const rem = DEADLINE - Date.now();
  bar.style.width = Math.max(0, Math.min(1, rem / ROOM.turnMs)) * 100 + '%';
  bar.classList.toggle('low', rem < 8000);
  if (canAct() && rem > 0 && rem < 5000 && Math.floor(rem / 1000) !== bar._s) { bar._s = Math.floor(rem / 1000); sfx.tick(); }
}, 250);

function showGameOver() {
  overShown = true;
  const isHost = ROOM.host === ME.uid;
  const ranks = GAME.players.map((pl, p) => ({ pl, p })).filter(x => x.pl.active)
    .sort((a, b) => (b.p === GAME.winner) - (a.p === GAME.winner) || C.scoreOf(b.pl) - C.scoreOf(a.pl));
  const medal = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣', '6️⃣'];
  openModal(`
    <h2 class="center">🏆 ${nm(GAME.winner)} vô địch!</h2>
    <ol class="rank">${ranks.map((x, i) => `<li style="--c:${C.SEATS[x.p].color}"><span>${medal[i]}</span><span class="grow">${nm(x.p)} <span class="muted small">${C.SEATS[x.p].horse}</span></span><span>${Math.round(C.scoreOf(x.pl) / C.maxScore(x.pl) * 100)}%</span></li>`).join('')}</ol>
    <div class="btns">
      <button class="ghost" id="ov-close">👀 Xem bàn cờ</button>
      ${isHost ? '<button class="gold" id="ov-again">🔁 Chơi ván mới</button>' : '<span class="muted small">Chờ chủ phòng mở ván mới...</span>'}
    </div>`);
  $('#ov-close').onclick = closeModal;
  if (isHost) $('#ov-again').onclick = () => { closeModal(); api('lobby'); };
}

// ================= INPUT =================
function onCard(card) {
  if (!canAct() || GAME.phase !== 'roll') return;
  sfx.pop();
  const me = mySeat(), mine = GAME.players[me].horses;
  if (cardMode && cardMode.card === card) { cardMode = null; renderControls(); return; }
  if (card === 'ghost' || card === 'turbo') return sendCard({ card });
  if (card === 'golden') {
    return pickModal('🎯 Xúc Xắc Vàng — chọn số bạn muốn', [1, 2, 3, 4, 5, 6].map(v => ({ html: '⚀⚁⚂⚃⚄⚅'[v - 1], value: v })), v => sendCard({ card, value: v }));
  }
  if (card === 'freeze') {
    const opts = GAME.players.map((pl, p) => ({ pl, p })).filter(x => x.pl.active && !x.pl.finished && x.p !== me)
      .map(x => ({ html: esc(x.pl.name), value: x.p, color: C.SEATS[x.p].color }));
    return pickModal('❄️ Đóng băng ai?', opts, v => sendCard({ card, target: v }));
  }
  if (!mine.some(h => h.loc === 'track' && !(card === 'shield' && h.shield))) return toast('Bạn chưa có ngựa nào phù hợp trên đường đua');
  if (card === 'swap' && !GAME.players.some((pl, p) => p !== me && pl.active && pl.horses.some(h => h.loc === 'track' && !h.shield)))
    return toast('Không có ngựa đối thủ nào để đổi chỗ');
  cardMode = { card, step: 'own' };
  renderControls();
}
function sendCard(data) {
  cardMode = null; pending = true; renderControls();
  api('card', data).then(j => { if (!j.ok) { pending = false; renderControls(); } });
}
function onHorseClick(p, h) {
  if (!canAct()) return;
  const me = mySeat(), hs = GAME.players[p].horses[h];
  if (cardMode) {
    if (cardMode.step === 'own') {
      if (p !== me || hs.loc !== 'track') return;
      if (cardMode.card === 'shield') { if (!hs.shield) sendCard({ card: 'shield', h }); }
      else { cardMode.h = h; cardMode.step = 'opp'; renderControls(); }
    } else if (p !== me && hs.loc === 'track' && !hs.shield) {
      sendCard({ card: 'swap', h: cardMode.h, target: { p, h } });
    }
    return;
  }
  if (GAME.phase === 'move' && p === me && GAME.legal.some(m => m.h === h)) {
    pending = true; renderControls();
    api('move', { h }).then(j => { if (!j.ok) { pending = false; renderControls(); } });
  }
}
function doRoll() {
  if (!canAct() || GAME.phase !== 'roll' || cardMode) return;
  ac();
  pending = true; renderControls();
  api('roll').then(j => { if (!j.ok) { pending = false; renderControls(); } });
}

// ================= MODALS =================
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="card">${html}</div>`; m.classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; }
function pickModal(title, options, cb) {
  openModal(`<h2 class="center">${title}</h2><div class="pick"></div><div class="btns"><button class="ghost" id="pk-x">Huỷ</button></div>`);
  const box = $('#modal .pick');
  for (const o of options) {
    const b = el('button', o.color ? 'pl' : '', o.html);
    if (o.color) b.style.setProperty('--c', o.color);
    b.onclick = () => { closeModal(); cb(o.value); };
    box.appendChild(b);
  }
  $('#pk-x').onclick = closeModal;
}
function showHelp() {
  const cards = Object.values(C.CARDS).map(c => `<li>${c.icon} <b>${c.name}</b> — ${c.desc}</li>`).join('');
  const myst = Object.values(C.MYSTERY).map(c => `${c.icon} ${c.name}`).join(' · ');
  const evs = Object.values(C.EVENTS).map(c => `<li>${c.icon} <b>${c.name}</b> — ${c.desc}</li>`).join('');
  openModal(`<div class="help">
    <h2>📖 Luật chơi — Lục Mã Hỗn Chiến</h2>
    <h3>Cơ bản (cờ cá ngựa Việt Nam)</h3>
    <ul>
      <li>Mỗi người có 2–4 ngựa trong chuồng. Gieo <b>1 hoặc 6</b> để xuất quân ra ô ★ màu của mình.</li>
      <li>Ngựa chạy theo chiều kim đồng hồ đúng số bước của xúc xắc. Gieo <b>6</b> được gieo thêm lượt.</li>
      <li><b>Luật cản:</b> không được nhảy qua đầu ngựa khác (trừ khi dùng thẻ 👻).</li>
      <li><b>Đá ngựa:</b> dừng đúng ô có ngựa đối thủ → ngựa đó bị đá về chuồng. Ai ngồi trên ô ★ của bạn cũng bị đá khi bạn xuất quân!</li>
      <li><b>Về chuồng đích:</b> chạy hết 1 vòng tới <b>cửa chuồng</b> (ô góc viền màu của bạn), rồi lên 6 bậc chuồng hướng vào tâm.
        <br>⚡ <i>Luật nhanh:</i> dư bước thì trượt thẳng vào chuồng; gieo số lớn hơn bậc hiện tại là lên tới bậc đó.
        <br>🏯 <i>Truyền thống:</i> phải dừng đúng cửa chuồng; từ cửa gieo n lên bậc n; sau đó mỗi lần chỉ lên 1 bậc và phải gieo đúng số bậc kế tiếp.</li>
      <li><b>Chiến thắng:</b> lấp đầy các bậc cao nhất (vd 3 ngựa → bậc 4, 5, 6 — các bậc sáng hơn).</li>
      <li>Mỗi lượt có 30 giây. Hết giờ hoặc mất mạng, máy sẽ tự đi giúp.</li>
    </ul>
    <h3>🔥 Chế độ Hỗn Loạn</h3>
    <ul>
      <li>🎁 <b>Ô quà</b> — nhận 1 thẻ kỹ năng. Đá được ngựa đối thủ cũng được 1 thẻ. Tối đa 3 thẻ.</li>
      <li>🌀 <b>Cổng dịch chuyển</b> — bay sang cổng cùng màu (có khi lợi to, có khi lùi cả vòng!).</li>
      <li>❓ <b>Ô bí ẩn</b> — ${myst}. Mở xong ô này sẽ dịch chuyển đi chỗ khác.</li>
      <li>🐉 Gieo 6 ba lần liên tiếp → <b>Thần Mã giáng thế</b>, tặng thẻ 👻.</li>
    </ul>
    <h3>🃏 Thẻ kỹ năng (dùng trước khi gieo, 1 thẻ mỗi lượt)</h3><ul>${cards}</ul>
    <h3>🌍 Biến cố toàn bàn (định kỳ mỗi vài lượt)</h3><ul>${evs}</ul>
    <div class="btns" style="margin-top:16px"><button class="gold" id="hp-x">Đã hiểu, chiến thôi!</button></div>
  </div>`);
  $('#hp-x').onclick = closeModal;
}

// ================= ROOM UI =================
function inviteLink() {
  const local = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
  const base = local && ME.lan.length ? ME.lan[0] : location.origin;
  return `${base}/?room=${ROOM.code}`;
}
function renderRoom() {
  const isHost = ROOM.host === ME.uid, me = mySeat();
  $('#room-code').textContent = ROOM.code;
  const local = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
  $('#room-links').innerHTML = `Mời bạn bè: <code>${esc(inviteLink())}</code>` +
    (local && ME.lan.length ? `<br>Bạn đang mở bằng localhost — bạn bè cùng wifi dùng link trên. Chơi qua Internet: xem README.` : '');
  const seats = $('#seats');
  seats.innerHTML = '';
  ROOM.seats.forEach((s, i) => {
    const info = C.SEATS[i];
    const d = el('div', `seat seat-${s.kind}${s.uid && s.uid === ME.uid ? ' mine' : ''}`);
    d.style.setProperty('--c', info.color);
    const who = s.kind === 'human' ? `👤 ${esc(s.name)}${s.uid === ME.uid ? ' (bạn)' : ''}${s.online ? '' : ' <span class="muted small">(offline)</span>'}`
      : s.kind === 'bot' ? `🤖 ${esc(s.name)}`
      : s.kind === 'closed' ? '<span class="muted">🚫 Đã đóng</span>'
      : '<span class="muted">Trống — bấm để ngồi</span>';
    d.innerHTML = `<div class="seat-horse">${KNIGHT}</div><div><div class="seat-color">${info.name} · ${info.horse}</div><div class="seat-who">${who}</div></div>`;
    if (s.kind === 'open') d.onclick = () => { sfx.pop(); api('sit', { seat: i }); };
    if (isHost) {
      const sel = el('select', 'seat-sel');
      sel.innerHTML = (s.kind === 'human' ? '<option value="human">👤 Người</option>' : '') +
        '<option value="open">Trống</option><option value="bot">🤖 Bot</option><option value="closed">🚫 Đóng</option>';
      sel.value = s.kind;
      sel.onclick = e => e.stopPropagation();
      sel.onchange = () => api('seatKind', { seat: i, kind: sel.value });
      d.appendChild(sel);
    }
    seats.appendChild(d);
  });
  const o = ROOM.opts, dis = isHost ? '' : 'disabled';
  const opt = (v, label, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${label}</option>`;
  const filled = ROOM.seats.filter(s => s.kind === 'human' || s.kind === 'bot').length;
  const est = Math.round({ 2: 15, 3: 25, 4: 37 }[o.horses] * Math.max(.45, filled / 6) * (o.home === 'classic' ? 1.8 : 1) * (o.chaos ? 1 : 3));
  $('#room-opts').innerHTML = `
    <label>Số ngựa mỗi người<select data-o="horses" ${dis}>${[2, 3, 4].map(v => opt(v, v + ' ngựa', o.horses)).join('')}</select></label>
    <label>Về chuồng<select data-o="home" ${dis}>${opt('fast', '⚡ Nhanh (dư bước vẫn vào)', o.home)}${opt('classic', '🏯 Truyền thống (đúng cửa, từng bậc)', o.home)}</select></label>
    <label>Luật cản<select data-o="block" ${dis}>${opt(true, '🚧 Có — không nhảy qua đầu', o.block)}${opt(false, 'Không', o.block)}</select></label>
    <label>Chế độ Hỗn Loạn<select data-o="chaos" ${dis}>${opt(true, '🔥 Bật — ô bí ẩn, thẻ, biến cố', o.chaos)}${opt(false, '😇 Tắt — cờ thuần', o.chaos)}</select></label>
    <label>Biến cố toàn bàn<select data-o="eventEvery" ${dis || (o.chaos ? '' : 'disabled')}>${[6, 10, 15].map(v => opt(v, `Mỗi ${v} lượt`, o.eventEvery)).join('')}</select></label>
    <label>Thời lượng ước tính<input value="~${est} phút" disabled></label>`;
  document.querySelectorAll('#room-opts select').forEach(sel => sel.onchange = () => {
    const k = sel.dataset.o, v = sel.value;
    api('opts', { opts: { [k]: k === 'horses' || k === 'eventEvery' ? +v : k === 'block' || k === 'chaos' ? v === 'true' : v } });
  });
  const watchers = ROOM.members.filter(m => m.seat < 0);
  $('#room-members').innerHTML = `👑 Chủ phòng: <b>${esc(ROOM.hostName)}</b>` +
    (watchers.length ? ` · 👀 Đang xem: ${watchers.map(m => esc(m.name) + (m.online ? '' : ' (offline)')).join(', ')}` : '');
  $('#btn-unsit').classList.toggle('hidden', me < 0);
  $('#btn-start').classList.toggle('hidden', !isHost);
  $('#btn-bots').classList.toggle('hidden', !isHost || !ROOM.seats.some(s => s.kind === 'open'));
  $('#btn-start').disabled = filled < 2;
  $('#room-wait').textContent = isHost ? (filled < 2 ? 'Cần ít nhất 2 người/bot' : '') : 'Chờ chủ phòng bắt đầu...';
}

// ================= NETWORK =================
async function api(action, data = {}) {
  let j;
  try {
    const r = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, code: ME.code, pid: ME.pid, ...data }) });
    j = await r.json();
  } catch { j = { ok: false, err: 'Mất kết nối tới server' }; }
  if (!j.ok) { toast('⚠️ ' + esc(j.err)); sfx.error(); }
  return j;
}
function connect() {
  if (es) es.close();
  es = new EventSource(`/events?code=${encodeURIComponent(ME.code)}&pid=${encodeURIComponent(ME.pid)}`);
  es.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'emote') return showEmote(msg);
    msg.recvAt = Date.now();
    enqueue(msg);
  };
  es.onerror = async () => {
    if (es.readyState !== EventSource.CLOSED) return; // trình duyệt tự kết nối lại
    const r = await fetch('/api', { method: 'POST', body: JSON.stringify({ action: 'ping', code: ME.code, pid: ME.pid }) }).then(r => r.json()).catch(() => null);
    if (r && !r.ok) { toast('⚠️ Phòng không còn tồn tại'); leaveRoom(); }
    else setTimeout(connect, 2000);
  };
}
function enterRoom(j) {
  Object.assign(ME, { code: j.code, pid: j.pid, uid: j.uid, lan: j.lan || [] });
  sessionStorage.setItem('ccn', JSON.stringify({ code: j.code, pid: j.pid }));
  history.replaceState(null, '', '?room=' + j.code);
  connect();
}
function leaveRoom() {
  if (es) es.close();
  es = null; ROOM = null; GAME = null; GAME_ID = null; Q.length = 0;
  sessionStorage.removeItem('ccn');
  history.replaceState(null, '', location.pathname);
  closeModal();
  show('home');
}
function showEmote(msg) {
  const seat = msg.seat;
  if (GAME && seat >= 0 && !$('#scr-game').classList.contains('hidden')) floatAt(stableCenter(seat), msg.e, 'emote');
  else floatAt({ screen: true, x: innerWidth * (.3 + Math.random() * .4), y: innerHeight * .8 }, msg.e, 'emote');
  if (GAME) log(`${msg.e} <b>${esc(msg.name)}</b>`);
}

// ================= INIT =================
function getName() {
  const n = $('#in-name').value.trim();
  if (!n) { toast('Nhập tên của bạn trước đã nhé!'); $('#in-name').focus(); return null; }
  localStorage.setItem('ccn_name', n);
  return n;
}
function init() {
  FX.cv = $('#fx'); FX.ctx = FX.cv.getContext('2d'); fxResize(); addEventListener('resize', fxResize);
  buildDice();
  // ngựa chạy đua ở màn hình chính
  C.SEATS.forEach((s, i) => {
    const sp = el('span', '', `<i style="color:${s.color};text-shadow:0 0 12px ${s.color}">${KNIGHT}</i>`);
    sp.style.bottom = (i % 3) * 14 + 'px';
    sp.style.animationDuration = (7 + Math.random() * 5) + 's';
    sp.style.animationDelay = (-Math.random() * 10) + 's';
    $('#race').appendChild(sp);
  });
  $('#in-name').value = localStorage.getItem('ccn_name') || '';
  const qRoom = new URLSearchParams(location.search).get('room');
  if (qRoom) $('#in-code').value = qRoom.toUpperCase();

  $('#btn-create').onclick = async () => { ac(); const name = getName(); if (!name) return; const j = await api('create', { name }); if (j.ok) enterRoom(j); };
  const join = async () => {
    ac();
    const name = getName(); if (!name) return;
    const code = $('#in-code').value.trim().toUpperCase();
    if (code.length !== 4) return toast('Mã phòng gồm 4 chữ cái');
    const saved = JSON.parse(sessionStorage.getItem('ccn') || 'null');
    const j = await api('join', { code, name, pid: saved && saved.code === code ? saved.pid : undefined });
    if (j.ok) enterRoom(j);
  };
  $('#btn-join').onclick = join;
  $('#in-code').onkeydown = e => { if (e.key === 'Enter') join(); };
  $('#btn-copy').onclick = () => {
    const link = inviteLink();
    const done = () => toast('📋 Đã copy link mời!');
    if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(link).then(done);
    else { const t = el('textarea'); t.value = link; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
  };
  $('#btn-unsit').onclick = () => api('unsit');
  $('#btn-bots').onclick = () => api('fillBots');
  $('#btn-start').onclick = () => { ac(); api('start'); };
  $('#btn-leave').onclick = leaveRoom;
  $('#btn-roll').onclick = doRoll;
  $('#dice').onclick = doRoll;
  $('#btn-exit').onclick = () => {
    if (ROOM && ROOM.host === ME.uid) { if (confirm('Kết thúc ván này và đưa mọi người về phòng chờ?')) api('lobby'); }
    else if (confirm('Rời khỏi phòng? (ngựa của bạn sẽ được máy tự đi)')) leaveRoom();
  };
  const sndBtn = () => { $('#btn-snd').textContent = SND.on ? '🔊' : '🔇'; $('#btn-music').style.opacity = SND.music ? 1 : .45; };
  $('#btn-snd').onclick = () => { SND.on = !SND.on; localStorage.setItem('ccn_snd', SND.on ? '1' : '0'); sndBtn(); ac(); };
  $('#btn-music').onclick = () => { SND.music = !SND.music; localStorage.setItem('ccn_music', SND.music ? '1' : '0'); sndBtn(); ac(); };
  sndBtn();
  document.querySelectorAll('[data-help]').forEach(b => b.onclick = showHelp);
  const em = $('#emotes');
  for (const e of EMOTES) { const b = el('button', '', e); b.onclick = () => api('emote', { e }); em.appendChild(b); }

  const board = $('#board');
  board.addEventListener('click', e => { const g = e.target.closest('.horse'); if (g) onHorseClick(+g.dataset.p, +g.dataset.h); });
  board.addEventListener('pointerover', e => {
    const g = e.target.closest('.horse.sel');
    if (!g || cardMode || !GAME || GAME.phase !== 'move') return;
    const m = GAME.legal.find(m => m.h === +g.dataset.h && +g.dataset.p === mySeat());
    if (m) showHint(m);
  });
  board.addEventListener('pointerout', e => { if (e.target.closest('.horse')) clearHint(); });
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space' && GAME) { e.preventDefault(); doRoll(); }
    if (e.key === 'Escape') { if (!$('#modal').classList.contains('hidden')) closeModal(); else if (cardMode) { cardMode = null; renderControls(); } }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && GAME) renderGame(); });

  // tự vào lại phòng khi F5
  const saved = JSON.parse(sessionStorage.getItem('ccn') || 'null');
  if (saved && (!qRoom || qRoom.toUpperCase() === saved.code)) {
    fetch('/api', { method: 'POST', body: JSON.stringify({ action: 'join', code: saved.code, pid: saved.pid }) })
      .then(r => r.json()).then(j => { if (j.ok) enterRoom(j); else sessionStorage.removeItem('ccn'); }).catch(() => {});
  }
}
init();
</script>
